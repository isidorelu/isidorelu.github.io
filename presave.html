      <!-- Pre-save page styles (scoped to .presave so they don't affect the rest of the site) -->

         body {

         }
         .presave {
            box-sizing: border-box;
            max-width: 420px;
            margin: 0 auto;
            padding: 48px 16px 32px;

            background: #fff;
         }
         .presave * {
            box-sizing: border-box;
            font-family: "Times New Roman", Times, serif;
            color: #000;
         }
         .presave .cover {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;

            font-size: 24px;
         }

   <body>
      <main class="presave">
         <!-- Swap for a self-hosted copy of the cover, e.g. src="sincerely-cover.jpg" -->
         <img class="cover"
              src="https://distrokid.imgix.net/http%3A%2F%2Fgather.fandalism.com%2F4077309--6F4AAB17-2699-40EB-81B381F96F0F29E9--0--1460939--lovepopcover3000.jpeg?fm=jpg&q=75&w=800&s=97d312ee3db091b5a15bec2f569a20dd"
              alt="Sincerely, Mr. Love &amp; Pop cover art" />

         <h1><em>Sincerely, Mr. Love &amp; Pop</em></h1>
         <p class="artist">isid or</p>

         <p class="date" id="date-line">Out October 9, 2026</p>
         <div class="countdown" id="countdown" aria-live="polite">
            <div><b id="d">–</b><span>days</span></div>
            <div><b id="h">–</b><span>hrs</span></div>
            <div><b id="m">–</b><span>min</span></div>
            <div><b id="s">–</b><span>sec</span></div>
         </div>

         <a class="presave-btn" id="presave"
            href="https://distrokid.com/hyperfollow/isidor4/sincerely-mr-love--pop"
            target="_blank" rel="noopener">
            <i class="fa-brands fa-spotify" aria-hidden="true"></i>
            <span id="btn-label">PRESAVE ON SPOTIFY</span>
         </a>
      </main>

      <script>
         // Drops the night of October 8 — i.e. midnight October 9, Eastern
         const RELEASE = new Date("2026-10-09T00:00:00-04:00");
         // Optional: once live, point the button at the album on Spotify
         const SPOTIFY_ALBUM_URL = ""; // e.g. "https://open.spotify.com/album/XXXXXXXX"

         const pad = n => String(n).padStart(2, "0");
         function tick() {
            const diff = RELEASE - new Date();
            if (diff <= 0) {
               document.getElementById("countdown").style.display = "none";
               document.getElementById("date-line").innerHTML = "<b>OUT NOW</b>";
               document.getElementById("btn-label").textContent = "LISTEN ON SPOTIFY";
               if (SPOTIFY_ALBUM_URL) document.getElementById("presave").href = SPOTIFY_ALBUM_URL;
               return;
            }
            const s = Math.floor(diff / 1000);
            document.getElementById("d").textContent = Math.floor(s / 86400);
            document.getElementById("h").textContent = pad(Math.floor(s % 86400 / 3600));
            document.getElementById("m").textContent = pad(Math.floor(s % 3600 / 60));
            document.getElementById("s").textContent = pad(s % 60);
            setTimeout(tick, 1000);
         }
         tick();
      </script>

      <footer>
         <div id="footer-placeholder"></div>
      </footer>

      <script src="load-components.js"></script>
   </body>
